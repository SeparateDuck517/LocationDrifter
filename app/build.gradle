plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.separ.locationdrifter'
    compileSdk 34

    defaultConfig {
        applicationId "com.separ.locationdrifter"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            def storePwd = System.getenv("STORE_PASSWORD")
            def aliasName = System.getenv("KEY_ALIAS")
            def keyPwd = System.getenv("KEY_PASSWORD")
            if (keystorePath != null && !keystorePath.trim().isEmpty()
                    && storePwd != null && !storePwd.isEmpty()
                    && aliasName != null && !aliasName.trim().isEmpty()
                    && keyPwd != null && !keyPwd.isEmpty()) {
                def ksFile = file(keystorePath.trim())
                if (ksFile.isFile() && ksFile.length() > 0) {
                    storeFile ksFile
                    storePassword storePwd
                    keyAlias aliasName.trim()
                    keyPassword keyPwd
                    enableV1Signing true
                    enableV2Signing true
                    enableV3Signing true
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
